name: Build WebDriverAgent IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout WDA v2.21.0 (iOS 13 compatible)
        run: git clone --branch v2.21.0 --depth 1 https://github.com/appium/WebDriverAgent.git

      - name: Build WDA
        run: |
          cd WebDriverAgent
          mkdir -p build
          xcodebuild build-for-testing \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=12.0

      - name: Package IPA
        run: |
          cd WebDriverAgent/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r WebDriverAgentRunner-Runner.app Payload/
          zip -r ../WebDriverAgent.ipa Payload
          mv ../WebDriverAgent.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-iOS13-old
          path: WebDriverAgent.ipa
