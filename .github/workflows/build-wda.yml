name: Build WebDriverAgent IPA (iOS 13)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Checkout WDA old version
        run: git clone --branch 1.0.0 --depth 1 https://github.com/appium/WebDriverAgent.git

      - name: Build WDA
        run: |
          cd WebDriverAgent
          mkdir -p build
          xcodebuild build-for-testing \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd WebDriverAgent/build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r WebDriverAgentRunner-Runner.app Payload/
          zip -r ../WebDriverAgent.ipa Payload
          mv ../WebDriverAgent.ipa $GITHUB_WORKSPACE/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-iOS13
          path: WebDriverAgent.ipa
